<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talaan - To-Do List</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* General Reset and Box Model */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        /* --- Global Keyframes --- */
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* --- Body and Phone-Size Container --- */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f7f6;
            padding: 20px;
        }

        /* Phone Screen Simulation (Max-width for mobile experience) */
        .phone-screen {
            width: 100%;
            max-width: 420px;
            height: 800px; 
            background: linear-gradient(36deg, #ffe6d1, #ffeba3, #ffffff, #e0f3ff, #d0dcff);
            background-size: 120% 120%;
            animation: gradientMove 15s ease-in-out infinite;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            position: relative; 
        }

        /* --- Background Shape Styles --- */
        .phone-screen .shape {
            height: 250px;
            width: 250px;
            position: absolute;
            border-radius: 50%;
            filter: blur(8px);
            opacity: 0.8;
            z-index: 0; 
        }

        .shape:last-child {
            background: linear-gradient(30deg, #ff5d12, #ffcd37, #ffffff);
            right: -60px;
            bottom: -10px;
        }

        /* --- Header --- */
        header {
            color: #083cb5;
            padding: 40px;
            text-align: center;
            font-size: 3em;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            z-index: 1; 
        }
        .app-logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }

        .app-title {
            font-size: 1.2em;
            font-weight: 700;
            color: #083cb5;
            margin: 0;
        }

        
        /* --- Auth Card Container (Holds both Login and Sign Up forms) --- */
        .auth-card {
            height: auto;
            width: 350px;
            background-color: rgba(255, 255, 255, 0.95);
            position: absolute;
            top: 55%; 
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 10px;
            border: 2px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.15);
            padding: 50px 35px;
            animation: fadeIn 1s ease-in-out;
            z-index: 1;
        }
        
        /* Form Content Layout */
        .auth-form-content {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group {
            text-align: left;
        }

        .input-label {
            display: block;
            font-size: 0.9em;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
        }

        .login-input {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px; 
            font-size: 1em;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .login-input:focus {
            border-color: #083cb5;
            outline: none;
            box-shadow: 0 0 0 3px rgba(8, 60, 181, 0.2);
        }

        /* Submit Button Styling */
        .login-btn {
            background-color: #083cb5; 
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(8, 60, 181, 0.3);
        }

        .login-btn:hover {
            background-color: #0434a6;
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        /* Small Text Links */
        .form-link-text {
            margin-top: 10px;
            font-size: 0.9em;
            text-align: center;
        }

        .form-link-text a {
            color: #FF5722; /* Accent color for action */
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s;
        }

        .form-link-text a:hover {
            color: #e64a19;
        }

        /* Styles for the "Don't have an account?" link */
        .create-account a {
            color: #3b3b3b;
        }
        
        .create-account a:hover {
            color: #202020;
        }
        
        /* Modal Styles */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background-color: rgba(0, 0, 0, 0.6); 
            display: none; justify-content: center; align-items: center; z-index: 20;
        }
        #message-modal {
            z-index: 30 !important;
        }
        .modal-content { 
            background-color: white; padding: 20px; border-radius: 15px; 
            width: 80%; max-width: 350px; box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3); 
            display: flex; flex-direction: column; gap: 15px; 
        }
        #close-modal-btn { /* Style for modal button */
            background-color: #083cb5;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
        }

    </style>
</head>
<body>
    <div class="phone-screen">
        <header id="app-header">
            <img src="../Pics/tala-logo.png" alt="Talaan" class="app-logo">



            <h1 class="app-title">Tala</h1>
        </header>
        
        <div class="shape"></div>

        <div id="auth-form-card" class="auth-card">

            <form id="login-form-view" class="auth-form-content">
                <h2 style="text-align: center; color: #083cb5; font-weight: 700; margin-bottom: 20px;">Welcome Back</h2>
                
                <div class="input-group">
                    <label for="login-email" class="input-label">Email Address</label>
                    <input type="email" id="login-email" class="login-input" placeholder="you@example.com" required>
                </div>

                <div class="input-group">
                    <label for="login-password" class="input-label">Password</label>
                    <input type="password" id="login-password" class="login-input" placeholder="&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;" required>
                </div>

                <button type="submit" class="login-btn">
                    Log In
                </button>
                
                <div class="form-link-text forgot-password">
                    <a href="#" onclick="event.preventDefault(); openForgotPasswordModal();">Forgot Password?</a>
                </div>

                <div class="form-link-text create-account">
                    Don't have an account? <a href="#" onclick="event.preventDefault(); toggleForm('signup');">Sign up</a>
                </div>
            </form>


            <form id="signup-form-view" class="auth-form-content" style="display: none;">
                <h2 style="text-align: center; color: #ff5d12; font-weight: 700; margin-bottom: 20px;">Create Account</h2>
                
                <div class="input-group">
                    <label for="signup-name" class="input-label">Full Name</label>
                    <input type="text" id="signup-name" class="login-input" placeholder="Enter name" required>
                </div>

                <div class="input-group">
                    <label for="signup-email" class="input-label">Email Address</label>
                    <input type="email" id="signup-email" class="login-input" placeholder="you@example.com" required>
                </div>

                <div class="input-group">
                    <label for="signup-password" class="input-label">Password</label>
                    <input type="password" id="signup-password" class="login-input" placeholder="&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679; (Min 8 characters)" minlength="8" required>
                </div>

                <button type="submit" class="login-btn" style="background-color: #ff5d12; box-shadow: 0 4px 10px rgba(255, 93, 18, 0.3);">
                    Sign Up
                </button>
                
                <div class="form-link-text create-account">
                    Already have an account? <a href="#" onclick="event.preventDefault(); toggleForm('login');">Log in</a>
                </div>
            </form>
        </div>
    </div>
    
    <div id="message-modal" class="modal-overlay">
        <div class="modal-content">
            <p id="modal-text" style="font-weight: 600; color: #333;">Action attempted.</p>
            <button onclick="closeModal()" id="close-modal-btn">Close</button>
        </div>
    </div>

    <!-- Confirmation modal shown after repeated failed logins -->
    <div id="forgot-confirm-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2 style="text-align: center; color: #083cb5; margin-bottom: 10px;">Forgot Password?</h2>
            <p style="text-align: center; color: #555; margin-bottom: 15px;">Did you forget your password?</p>
            <div style="display:flex; gap:10px;">
                <button id="confirm-yes" onclick="onConfirmForgotYes()" style="flex:1; padding:12px; background-color: #083cb5; color: white; border: none; border-radius: 8px; font-weight:600; cursor:pointer;">Yes, Reset</button>
                <button id="confirm-no" onclick="closeForgotConfirmModal()" style="flex:1; padding:12px; background-color: #ccc; color: #333; border: none; border-radius: 8px; font-weight:600; cursor:pointer;">No, Cancel</button>
            </div>
        </div>
    </div>

    <div id="forgot-password-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2 style="text-align: center; color: #083cb5; margin-bottom: 20px;">Reset Password</h2>
            
            <p style="text-align: center; color: #555; margin-bottom: 15px;">Enter your email and new password</p>
            <input type="email" id="forgot-email" placeholder="you@example.com" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1em; margin-bottom: 10px;">
            <input type="password" id="new-password" placeholder="New Password" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1em; margin-bottom: 15px;">
            <button onclick="resetPassword()" style="width: 100%; padding: 12px; background-color: #083cb5; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">Reset Password</button>
            <button onclick="closeForgotPasswordModal()" style="width: 100%; padding: 12px; background-color: #ccc; color: #333; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px;">Cancel</button>
        </div>
    </div>

    <script>
        // --- Configuration (MUST MATCH server.js) ---
        const API_BASE_URL = "http://localhost:5000"; 
        
        // --- DOM Elements ---
        const loginForm = document.getElementById('login-form-view');
        const signupForm = document.getElementById('signup-form-view');
        const messageModal = document.getElementById('message-modal');
        const modalText = document.getElementById('modal-text');

        // --- Utility Functions ---
        function toggleForm(formType) {
            if (formType === 'signup') {
                loginForm.style.display = 'none';
                signupForm.style.display = 'flex';
            } else {
                signupForm.style.display = 'none';
                loginForm.style.display = 'flex';
            }
        }

        function showModal(msg) {
            modalText.textContent = msg;
            messageModal.style.display = 'flex';
        }

        function closeModal() {
            messageModal.style.display = 'none';
        }

        // --- Login failure tracking ---
        const MAX_FAILED_ATTEMPTS = 5;
        const FAILED_ATTEMPTS_KEY = 'talaan_failed_attempts';

        function getFailedAttempts() {
            return parseInt(localStorage.getItem(FAILED_ATTEMPTS_KEY) || '0', 10);
        }

        function setFailedAttempts(n) {
            localStorage.setItem(FAILED_ATTEMPTS_KEY, String(n));
        }

        function resetFailedAttempts() {
            setFailedAttempts(0);
        }

        function incrementFailedAttempts() {
            const attempts = getFailedAttempts() + 1;
            setFailedAttempts(attempts);
            if (attempts >= MAX_FAILED_ATTEMPTS) {
                // reset counter and show a styled confirmation modal
                resetFailedAttempts();
                // store login email to prefill in the actual reset form if user agrees
                try {
                    const loginEmailInput = document.getElementById('login-email');
                    window.__pendingPrefillEmail = (loginEmailInput && loginEmailInput.value && loginEmailInput.value.trim()) || '';
                } catch (e) {
                    window.__pendingPrefillEmail = '';
                }

                openForgotConfirmModal();
            }

            return attempts;
        }

        // --- Forgot Password Functions ---
        let forgotPasswordEmail = '';

        function openForgotPasswordModal() {
            document.getElementById('forgot-password-modal').style.display = 'flex';
            document.getElementById('forgot-email').value = '';
            document.getElementById('new-password').value = '';
        }

        function closeForgotPasswordModal() {
            document.getElementById('forgot-password-modal').style.display = 'none';
        }

        async function resetPassword() {
            const email = document.getElementById('forgot-email').value.trim();
            const newPassword = document.getElementById('new-password').value.trim();

            if (!email || !newPassword) {
                showModal('Please enter both email and new password');
                return;
            }

            if (newPassword.length < 6) {
                showModal('Password must be at least 6 characters long');
                return;
            }

            showModal('Resetting password...');

            try {
                const response = await fetch(`${API_BASE_URL}/reset-password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        email,
                        newPassword
                    }),
                });

                const data = await response.json();

                if (response.ok) {
                    showModal(data.message || 'Password reset successfully! You can now log in.');
                    
                    // Close modal and reset form after successful reset
                    setTimeout(() => {
                        closeForgotPasswordModal();
                        closeModal();
                        document.getElementById('login-form-view').style.display = 'flex';
                        document.getElementById('login-form-view').reset();
                    }, 1500);
                } else {
                    showModal(data.error || 'Password reset failed');
                }
            } catch (err) {
                showModal('Connection error. Please ensure the server is running.');
            }
        }

        // 🟢 Handle Sign Up (Register)
        signupForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            const username = document.getElementById("signup-name").value.trim();
            const email = document.getElementById("signup-email").value.trim();
            const password = document.getElementById("signup-password").value.trim();

            showModal("Creating account...");

            try {
                const response = await fetch(`${API_BASE_URL}/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, email, password }),
                });

                const data = await response.json();
                showModal(data.message || data.error);

                if (response.ok) { // Use response.ok for success check
                    toggleForm('login'); // Switch to login screen on success
                }
            } catch (err) {
                showModal("Connection error. Please ensure the server is running.");
            }
        });

        // 🔵 Handle Login
        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("login-email").value.trim();
            const password = document.getElementById("login-password").value.trim();
            
            // Don't show the generic "Logging in..." modal if this is the final (5th) attempt
            const willBeFinalAttempt = getFailedAttempts() >= (MAX_FAILED_ATTEMPTS - 1);
            if (!willBeFinalAttempt) showModal("Logging in...");

            try {
                const response = await fetch(`${API_BASE_URL}/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password }),
                });

                const data = await response.json();
                
                if (response.ok) {
                    // reset failed attempts on successful login
                    resetFailedAttempts();

                    // 🔑 CRITICAL: Save the User ID and Username to local storage
                    localStorage.setItem('talaan_userId', data.userId);
                    localStorage.setItem('talaan_username', data.username); 

                    showModal(data.message);

                    // Redirect after successful login
                    setTimeout(() => {
                        window.location.href = "todo.html"; // Redirect to your main page
                    }, 500);

                } else {
                    // Handle login failure
                    // increment failed attempts and possibly prompt for password reset
                    const attempts = incrementFailedAttempts();
                    // On reaching the max attempts do not show the invalid-credentials message
                    if (attempts < MAX_FAILED_ATTEMPTS) {
                        // only show failure message if we didn't suppress the logging modal earlier
                        showModal(data.error || "Login failed. Check server log.");
                    } else {
                        // If this was the final attempt and we had previously shown the "Logging in..." modal,
                        // ensure it's not left open.
                        closeModal();
                    }
                }
            } catch (err) {
                showModal("Connection error. Please ensure the server is running.");
            }
        });
        
        // Optional: Check if already logged in on load
        window.onload = () => {
            const storedUserId = localStorage.getItem('talaan_userId');
            if (storedUserId) {
                // If a user ID exists, you might redirect them automatically.
                // window.location.href = "todo.html"; 
            }
        };

        // --- Confirm modal handlers ---
        function openForgotConfirmModal() {
            document.getElementById('forgot-confirm-modal').style.display = 'flex';
        }

        function closeForgotConfirmModal() {
            document.getElementById('forgot-confirm-modal').style.display = 'none';
        }

        function onConfirmForgotYes() {
            // If we stored a pending email, prefill the reset form, then open it
            try {
                const pending = window.__pendingPrefillEmail || '';
                const forgotEmailInput = document.getElementById('forgot-email');
                if (forgotEmailInput) forgotEmailInput.value = pending;
            } catch (e) {
                // ignore
            }

            closeForgotConfirmModal();
            openForgotPasswordModal();
        }

    </script>

</body>
</html>
